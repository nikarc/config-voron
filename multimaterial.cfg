[gcode_macro _TOOL_STATE]
variable_current: -1        # -1 = unknown / no print running
gcode:

[gcode_macro T0]
gcode:
    {% set cur = printer["gcode_macro _TOOL_STATE"].current %}
    {% if cur != -1 and cur != 0 %}
        MATERIAL_CHANGE
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_TOOL_STATE VARIABLE=current VALUE=0

[gcode_macro T1]
gcode:
    {% set cur = printer["gcode_macro _TOOL_STATE"].current %}
    {% if cur != -1 and cur != 1 %}
        MATERIAL_CHANGE
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_TOOL_STATE VARIABLE=current VALUE=1
