[gcode_macro PARK]
gcode:
    {% set th = printer.toolhead %}
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y//2} Z30

[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    CG28
    QUAD_GANTRY_LEVEL
    G28

[gcode_macro PRINT_START]
gcode:
    {% set hotend_temp = params.HOTEND | int %}
    {% set bed_temp = params.BED_TEMP | int %}

    UV_ON

    # Start heating early
    M104 S{hotend_temp} ; Start heating hotend (don't wait)
    M140 S{bed_temp}    ; Start heating bed (don't wait)

    # Mechanical operations while heating
    G28                 ; Home all axes
    QUAD_GANTRY_LEVEL   ; Level gantry
    G28                 ; Home again after QGL

    # Wait for temperatures
    M190 S{bed_temp}    ; Wait for bed to reach temp
    M109 S{hotend_temp} ; Wait for hotend to reach temp

    BED_MESH_CALIBRATE ADAPTIVE=1

    PRIME_LINE        ; Print a prime line


[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 25, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F1800                 ; retract filament

    TURN_OFF_HEATERS

    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 100} F3600  ; park nozzle at rear
    M107                                     ; turn off fan

    BED_MESH_CLEAR

    # The purpose of the SAVE_GCODE_STATE/RESTORE_GCODE_STATE
    # command pair is to restore the printer's coordinate system
    # and speed settings since the commands above change them.
    # However, to prevent any accidental, unintentional toolhead
    # moves when restoring the state, explicitly set MOVE=0.
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

[gcode_macro SERVICE_POSITION]
gcode:
    G90
    G0 X175 Y40 Z50 F6000

[gcode_macro CENTER]
gcode:
    G1 X175 Y175 F3000

[gcode_macro PREHEAT_ABS]
gcode:
    # M104 S245
    M104 S245
    M140 S110
    #SET_FAN_SPEED FAN=nevermore SPEED=0.5

[gcode_macro PREHEAT_PLA]
gcode:
    # M104 S200
    M104 S215
    M140 S70

[gcode_macro PREHEAT_PETG]
gcode:
    # M104 S260
    M104 S235
    M140 S80

[gcode_macro CG28]
description: Helper: Conditional homing
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% else %}
    M117 Already homed, skipping G28...
  {% endif %}

[gcode_macro UV_ON]
description: Turn on UV lights to 100%
gcode:
    SET_PIN PIN=uv_light VALUE=1
    SET_PIN PIN=uv_light2 VALUE=1

[gcode_macro UV_OFF]
description: Turn off UV lights
gcode:
    SET_PIN PIN=uv_light VALUE=0
    SET_PIN PIN=uv_light2 VALUE=0

[gcode_macro CHOOSE_BEACON_MODEL]
description: Pick a Beacon model from a list
gcode:
    {% set models = [] %}
    {% for section in printer.configfile.settings if section.startswith("beacon model ") %}
        {% set _ = models.append(section[13:]) %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_begin Select Beacon Model"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for m in models %}
        RESPOND TYPE=command MSG="action:prompt_button {m}|SET_BEACON_MODEL MODEL_NAME={m}|primary"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro SET_BEACON_MODEL]
description: Select a Beacon model (falls back to default)
gcode:
    {% set requested = params.MODEL_NAME|default("")|lower|replace(" ", "_") %}
    {% if requested == "" %}{% set requested = "default" %}{% endif %}
    {% set models = [] %}
    {% for section in printer.configfile.settings if section.startswith("beacon model ") %}
        {% set _ = models.append(section[13:]) %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if requested in models %}
        BEACON_MODEL_SELECT NAME={requested}
    {% else %}
        {action_respond_info("Beacon model '%s' not found (have: %s), using 'default'" % (requested, models|join(", ")))}
        BEACON_MODEL_SELECT NAME=default
    {% endif %}
