[include mainsail.cfg]
[include prime_line.cfg]

[respond]
[exclude_object]

[force_move]
 enable_force_move: True

## Important!
## @see Other configs that may override settings in this file!
##
## sensorless_homing.cfg
## nitehawk36.cfg
## wristwatch_g2.cfg

## Voron Design VORON2 250/300/350mm Spider TMC2209 UART config

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths							          [mcu] section
## Thermistor types						      [extruder] and [heater_bed] sections - See 'sensor types' list at end of file
## Z Endstop Switch location	      [safe_z_home] section
## Homing end position				      [gcode_macro G32] section
## Z Endstop Switch  offset for Z0	[stepper_z] section
## Probe points							        [quad_gantry_level] section
## Min & Max gantry corner postions	[quad_gantry_level] section
## PID tune								          [extruder] and [heater_bed] sections
## Fine tune E steps					      [extruder] section

[mcu]
##	Obtain definition by "ls -l /dev/serial/by-id/"
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_33001D001351303530323539-if00

[include beacon.cfg]

## Uncomment below if you're using the Raspberry uart0 to communicate with Spider
#restart_method: command

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 5000                 #Max 4000
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

#####################################################################
#      X/Y Stepper Settings
#####################################################################

##  Connected to X-MOT (B Motor)
[stepper_x]
step_pin: PE11
dir_pin: !PE10
enable_pin: !PE9
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:400  #set to 400 for 0.9 degree stepper
endstop_pin: ^PA1
position_min: 0

##--------------------------------------------------------------------

##  Uncomment below for 250mm build
#position_endstop: 250
#position_max: 250

##  Uncomment for 300mm build
#position_endstop: 300
#position_max: 300

##  Uncomment for 350mm build
position_endstop: 350
position_max: 350

##--------------------------------------------------------------------
homing_speed: 25   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_x]
uart_pin: PE7
interpolate: False
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 0

##  Connected to E0-MOT (A Motor), moved from Y-MOT due to possible bad port
[stepper_y]
# step_pin: PD8
# dir_pin: !PB12
# enable_pin: !PD9
step_pin: PD5
dir_pin: !PD6
enable_pin: !PD4
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:400  #set to 400 for 0.9 degree stepper
endstop_pin: ^PA2
position_min: 0
##--------------------------------------------------------------------

##  Uncomment for 250mm build
#position_endstop: 250
#position_max: 250

##  Uncomment for 300mm build
#position_endstop: 300
#position_max: 300

##  Uncomment for 350mm build
position_endstop: 350
position_max: 350

##--------------------------------------------------------------------
homing_speed: 25  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_y]
# uart_pin: PE15 Moved to EO-MOT
uart_pin: PD7
interpolate: False
run_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Z Stepper Settings
#####################################################################

## In Z-MOT Position
## Z0 Stepper - Front Left
[stepper_z]
step_pin: PD14
dir_pin: !PD13
enable_pin: !PD15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
##  In Z- Position
# endstop_pin: ^PA0
endstop_pin: probe:z_virtual_endstop ## For TAP z-offset
##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##	Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
# position_endstop: 0
##--------------------------------------------------------------------

##	Uncomment below for 250mm build
#position_max: 230

##	Uncomment below for 300mm build
#position_max: 280

##	Uncomment below for 350mm build
position_max: 330

##--------------------------------------------------------------------
position_min: -5
homing_speed: 8
second_homing_speed: 3
# homing_retract_dist: 3

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z]
uart_pin: PD10
interpolate: True
run_current: 0.8
# hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

##	In E1-MOT Position
##	Z1 Stepper - Rear Left
[stepper_z1]
step_pin: PE6
dir_pin: PC13
enable_pin: !PE5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z1]
uart_pin: PC14
interpolate: True
run_current: 0.8
# hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

##	In E2-MOT Position
##	Z2 Stepper - Rear Right
[stepper_z2]
step_pin: PE2
dir_pin: !PE4
enable_pin: !PE3
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z2]
uart_pin: PC15
interpolate: true
run_current: 0.8
# hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

##	In E3-MOT Position
##	Z3 Stepper - Front Right
[stepper_z3]
step_pin: PD12
dir_pin: PC4
enable_pin: !PE8
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PA15
interpolate: true
run_current: 0.8
# hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

#####################################################################
#   Extruder
#####################################################################

##  In E0-MOT Position
[extruder]
step_pin: PD5
dir_pin: PD6
enable_pin: !PD4
##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.6789511 is a good starting point

##  WARN: wristwatch_g2.cfg
## rotation_distance: 20.860841390947286   #Bondtech 5mm Drive Gears

##  Update Gear Ratio depending on your Extruder Type
##  Use 50:10 for Stealthburner/Clockwork 2
##  Use 50:17 for Afterburner/Clockwork (BMG Gear Ratio)
##  Use 80:20 for M4, M3.1
gear_ratio: 50:10
microsteps: 32
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
##      In E0 OUT Position
heater_pin: PB15
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
sensor_type: PT1000
sensor_pin: PC0
min_temp: 10
# max_temp: 270
max_temp: 285 # Rapido is good to 300C
max_power: 1.0
min_extrude_temp: 170
#control = pid
#pid_kp = 26.213
#pid_ki = 1.304
#pid_kd = 131.721
##  Try to keep pressure_advance below 1.0
# Pressure advance should be set in the slicer, per-filament
# pressure_advance: 0.02
##  Default is 0.040, leave stock
#pressure_advance_smooth_time: 0.040
max_extrude_only_distance: 101
min_extrude_temp: 30

##  In E0-MOT Position
##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 extruder]
uart_pin: PD7
interpolate: false
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Bed Heater
#####################################################################
##  SSR Pin - In BED OUT position
[heater_bed]
heater_pin: PB4
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PB0
##	Adjust Max Power so your heater doesn't warp your bed
max_power: 0.6
min_temp: 0
max_temp: 120
control: pid
pid_kp: 58.437
pid_ki: 2.347
pid_kd: 363.769

##--------------------------------------------------------------------
##  Select the option that matches your board
#sensor_pin: PC3 # Spider 1.0 & 1.1
#sensor_pin: PB0 # Spider 2.2
##--------------------------------------------------------------------

##  Adjust max_power so it doesn't exceed the SSR rating. The Omron G3NA-210B-DC5 SSR is rated at 4 amps without a heatsink.
##  The formula is "4 / (Wattage_of_bed_heater / Mains_voltage) = max_power"
##  If max_power is greater than 1.0, use 1.0
max_power: 0.6
min_temp: 0
max_temp: 120
control: pid
pid_kp: 58.437
pid_ki: 2.347
pid_kd: 363.769

#####################################################################
#   Fan Control
#####################################################################

##  Hotend Fan - FAN0 Connector
[heater_fan hotend_fan]
## @see nitehawk36.cfg
##  Select pin for your Spider board
##--------------------------------------------------------------------
# pin: PB0   # Spider 1.0 & 1.1
# pin: PA13  # Spider 2.2
##--------------------------------------------------------------------
max_power: 1.0
#kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
##  If you are experiencing back flow, you can reduce fan_speed
#fan_speed: 1.0

##  Print Cooling Fan - FAN1 Connector
[fan]
##--------------------------------------------------------------------
#pin: PB1   # Spider 1.0 & 1.1
#pin: PA14  # Spider 2.2
##--------------------------------------------------------------------
#max_power: 1.0
#kick_start_time: 0.5
##  Depending on your fan, you may need to increase this value
##  if your fan will not start. Can change cycle_time (increase)
##  if your fan is not able to slow down effectively
off_below: 0.10

##  Controller fan - FAN2 Connector
[heater_fan controller_fan]
pin: PB2
#kick_start_time: 0.5
heater: heater_bed
heater_temp: 45.0

##  Exhaust fan - In E2 OUT Positon
#[heater_fan exhaust_fan]
#pin: PB3
#max_power: 1.0
#shutdown_speed: 0.0
##kick_start_time: 0.5
#heater: heater_bed
#heater_temp: 60
#fan_speed: 1.0

#####################################################################
#   LED Control
#####################################################################

##  Chamber Lighting - In E1 OUT Position
#[output_pin caselight]
#pin: PC8
#pwm: true
#shutdown_value: 0
#cycle_time: 0.01
[output_pin uv_light]
pin: PA14
pwm: True
shutdown_value: 0
value: 0
cycle_time: 0.01

[output_pin uv_light2]
pin: PA13
pwm: True
shutdown_value: 0
value: 0
cycle_time: 0.01

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 3600

# [safe_z_home]
# ##  XY Location of the Z Endstop Switch
# ##  Update -10,-10 to the XY coordinates of your endstop pin
# ##  (such as 157,305) after going through Z Endstop Pin
# ##  Location Definition step.
# home_xy_position:-10,-10
# speed:100
# z_hop:10

# @see: beacon.cfg
# [homing_override]
# set_position_z: 10
# axes: xyz
# gcode:
#     G90
#     G1 Z15 F600
#     G28 X0 Y0 F6000
#     G1 X175 Y175 F6000
#     G28 Z0
#     G1 Z15 F600

##  Use QUAD_GANTRY_LEVEL to level a gantry. `microsteps: 32` do?
##  Min & Max gantry corners - measure from nozzle at MIN (0,0) and
##  MAX (250, 250), (300,300), or (350,350) depending on your printer size
##  to respective belt positions
[quad_gantry_level]
horizontal_move_z: 10

#--------------------------------------------------------------------
##  Gantry Corners for 250mm Build
##  Uncomment for 250mm build
#gantry_corners:
#   -60,-10
#   310, 320
##  Probe points
#points:
#   50,25
#   50,175
#   200,175
#   200,25

##  Gantry Corners for 300mm Build
##  Uncomment for 300mm build
#gantry_corners:
#   -60,-10
#   360,370
##  Probe points
#points:
#   50,25
#   50,225
#   250,225
#   250,25

##  Gantry Corners for 350mm Build
##  Uncomment for 350mm build
gantry_corners:
  -60,-10
  410,420
#  Probe points
points:
  50,25
  50,275
  300,275
  300,25

#--------------------------------------------------------------------
speed: 300
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

#####################################################################
#   Bed Mesh Leveling
#####################################################################

[bed_mesh]
speed: 300
horizontal_move_z: 10
##--------------------------------------------------------------------
##	Uncomment below for 250mm build
#mesh_min: 40, 40
#mesh_max: 210,210

##	Uncomment for 300mm build
#mesh_min: 40, 40
#mesh_max: 260,260

##	Uncomment for 350mm build
mesh_min: 40, 40
mesh_max: 310,310
##--------------------------------------------------------------------
fade_start: 0.6
fade_end: 10.0
probe_count: 20,20
algorithm: bicubic
# relative_reference_index: 12
zero_reference_position: 310,310

#####################################################################
#   Displays
#####################################################################

#--------------------------------------------------------------------

#   mini12864 LCD Display
[display]
lcd_type: uc1701
cs_pin: PC11
a0_pin: PD2
rst_pin: PC10
encoder_pins: ^PC6,^PC7
click_pin: ^!PA8
contrast: 63
#spi_bus: spi1
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5

#   To control Neopixel RGB in mini12864 display
[neopixel fysetc_mini12864]
pin: PC12
chain_count: 3
initial_RED: 0.1
initial_GREEN: 0.5
initial_BLUE: 0.0
color_order: RGB

#   Set RGB values on boot up for each Neopixel.
#   Index 1 = display, Index 2 and 3 = Knob
[delayed_gcode setdisplayneopixel]
initial_duration: 1
gcode:
        SET_LED LED=fysetc_mini12864 RED=1 GREEN=1 BLUE=1 INDEX=1 TRANSMIT=0
        SET_LED LED=fysetc_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=2 TRANSMIT=0
        SET_LED LED=fysetc_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=3

#--------------------------------------------------------------------


#####################################################################
#   Macros
#####################################################################
[gcode_macro PARK]
gcode:
    {% set th = printer.toolhead %}
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y//2} Z30

[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    CG28
    QUAD_GANTRY_LEVEL
    G28

[gcode_macro PRINT_START]
gcode:
    {% set hotend_temp = params.HOTEND | int %}
    {% set bed_temp = params.BED_TEMP | int %}

    UV_ON

    # Start heating early
    M104 S{hotend_temp} ; Start heating hotend (don't wait)
    M140 S{bed_temp}    ; Start heating bed (don't wait)

    # Mechanical operations while heating
    G28                 ; Home all axes
    QUAD_GANTRY_LEVEL   ; Level gantry
    G28                 ; Home again after QGL

    # Wait for temperatures
    M190 S{bed_temp}    ; Wait for bed to reach temp
    M109 S{hotend_temp} ; Wait for hotend to reach temp

    BED_MESH_CALIBRATE ADAPTIVE=1

    PRIME_LINE        ; Print a prime line


[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 25, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F1800                 ; retract filament

    TURN_OFF_HEATERS

    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 100} F3600  ; park nozzle at rear
    M107                                     ; turn off fan

    BED_MESH_CLEAR

    # The purpose of the SAVE_GCODE_STATE/RESTORE_GCODE_STATE
    # command pair is to restore the printer's coordinate system
    # and speed settings since the commands above change them.
    # However, to prevent any accidental, unintentional toolhead
    # moves when restoring the state, explicitly set MOVE=0.
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

[gcode_macro SERVICE_POSITION]
gcode:
    G90
    G0 X175 Y40 Z50 F6000

[gcode_macro CENTER]
gcode:
    G1 X175 Y175 F3000

[gcode_macro PREHEAT_ABS]
gcode:
    # M104 S245
    M104 S245
    M140 S110
    #SET_FAN_SPEED FAN=nevermore SPEED=0.5

[gcode_macro PREHEAT_PLA]
gcode:
    # M104 S200
    M104 S215
    M140 S70

[gcode_macro PREHEAT_PETG]
gcode:
    # M104 S260
    M104 S235
    M140 S80

[gcode_macro CG28]
description: Helper: Conditional homing
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% else %}
    M117 Already homed, skipping G28...
  {% endif %}

[gcode_macro UV_ON]
description: Turn on UV lights to 100%
gcode:
    SET_PIN PIN=uv_light VALUE=1
    SET_PIN PIN=uv_light2 VALUE=1

[gcode_macro UV_OFF]
description: Turn off UV lights
gcode:
    SET_PIN PIN=uv_light VALUE=0
    SET_PIN PIN=uv_light2 VALUE=0

[gcode_macro PA_CAL]
# Pressure Advance Simple Test macro.
# Usage: PA_CAL BED=100 EXTRUDER=220 PA_START=0.03 PA_STEP=0.002 NZL=0.4
# Or with no parameters as: PA_CAL, this would execute as
# PA_CAL BED=65 EXTRUDER=220 PA_START=0.0 PA_STEP=0.005 NZL=(as per printer.cfg)
# First prints a line with current set PA, then prints 20 line segments
# starting with PA_START, increasing each line by PA_STEP.
# Based http://realdeuce.github.io/Voron/PA/pressure_advance.html
# Assisted by u/imoftendisgruntled, u/scul86, and thanks to u/beansisfat, u/stray_r
# If using BOWDEN setup and having difficulty, try increasing retraction/un-retraction
# settings below to 1.25 vice 0.75. Search/replace 0.75 with 1.25

description: Tune Pressure Advance
gcode:
    {% if printer.idle_timeout.state == "Printing" or printer.pause_resume.is_paused %}
        {action_respond_info("Cannot do that while printing")}

    {% else %}
        {% set BED = params.BED|default(65)|float %}
        {% set EXTRUDER = params.EXTRUDER|default(220)|float %}
        {% set PA_START = params.PA_START|default(0.0)|float %}
        {% set PA_STEP = params.PA_STEP|default(0.005)|float %}
        {% set NZL_CFG = printer.configfile.config["extruder"]["nozzle_diameter"]|float %}
        {% set NZL = params.NZL|default(NZL_CFG)|float %}
	{% set EXM = params.EXM|default(100)|float %}
        {% set E20 = ( (EXM/100) * ( (0.1147475 * NZL) * 20) )|float %}
        {% set E40 = ( (EXM/100) * ( (0.1147475 * NZL) * 40) )|float %}
        {% set X_MID = printer.configfile.config["stepper_x"]["position_max"]|float / 2.0 %}
        {% set Y_MID = printer.configfile.config["stepper_y"]["position_max"]|float / 2.0 %}

        PRINT_START BED_TEMP={BED} HOTEND={EXTRUDER}

        G21 ; Millimeter units
        G90 ; Absolute XYZ
        M83 ; Relative E
        SET_VELOCITY_LIMIT ACCEL=3000 ACCEL_TO_DECEL=1500
        G92 E0
        M106 S0

        G1 X{(X_MID-40)} Y{(Y_MID-65)} F30000          ; move to start position
        G1 Z0.25 F300                                  ; move to layer height
        G1 E0.75 F1800                                 ; un-retract
        G1 X{(X_MID-20)} Y{(Y_MID-65)} E{E20} F300     ; print line part one
        G1 X{(X_MID+20)} Y{(Y_MID-65)} E{E40} F9000    ; print line part two
        G1 X{(X_MID+40)} Y{(Y_MID-65)} E{E20} F300     ; print line part three
        G1 E-0.75 F1800                                ; retract
        G1 Z1 F300                                     ; Move above layer height

        {% for i in range(0, 20) %}
            SET_PRESSURE_ADVANCE ADVANCE={PA_START + (i * PA_STEP)} ; set Pressure Advance
            M117 Testing Pressure Advance at: {PA_START + (i * PA_STEP)}
            G1 X{(X_MID-40)} Y{(Y_MID-35)+(5*i)} F30000           ; move to start position
            G1 Z0.25 F300                                         ; move to layer height
            G1 E0.75 F1800                                        ; un-retract
            G1 X{(X_MID-20)} Y{(Y_MID-35)+(5*i)} E{E20} F300      ; print line part one
            G1 X{(X_MID+20)} Y{(Y_MID-35)+(5*i)} E{E40} F9000     ; print line part two
            G1 X{(X_MID+40)} Y{(Y_MID-35)+(5*i)} E{E20} F300      ; print line part three
            G1 E-0.75 F1800                                       ; retract
            G1 Z1 F300                                            ; Move above layer height
        {% endfor %}

	M117 Find best line and multiply it by ({PA_START} + (line * {PA_STEP}) ) to find your PA setting.

        PRINT_END

    {% endif %}

[gcode_macro PRINT_SQUARE]
description: Print a 30x30x0.25mm single-layer square. Params: SIZE, HEIGHT, WIDTH, BED, HOTEND, SPEED, FLOW, FIL_D
gcode:
    # ---- Parameters (override e.g. PRINT_SQUARE HOTEND=240 BED=100) ----
    {% set size   = params.SIZE|default(30)|float %}       # square side, mm
    {% set h      = params.HEIGHT|default(0.25)|float %}   # layer height, mm
    {% set w      = params.WIDTH|default(0.45)|float %}    # extrusion width, mm (0.4 nozzle)
    {% set bed    = params.BED|default(110)|int %}
    {% set hot    = params.HOTEND|default(250)|int %}
    {% set speed  = params.SPEED|default(40)|float * 60 %} # mm/s -> mm/min
    {% set flow   = params.FLOW|default(1.0)|float %}
    {% set fil_d  = params.FIL_D|default(1.75)|float %}

    # ---- Geometry: centered on 350x350 bed ----
    {% set cx = 175.0 %}
    {% set cy = 175.0 %}
    {% set sx0 = cx - size/2 + w/2 %}   # line centers inset by w/2 so outer size = SIZE
    {% set sx1 = cx + size/2 - w/2 %}
    {% set sy0 = cy - size/2 + w/2 %}
    {% set sy1 = cy + size/2 - w/2 %}

    # ---- Extrusion math ----
    {% set fil_area = 3.14159265 * (fil_d/2)**2 %}
    {% set e_mm = (w * h / fil_area) * flow %}   # filament mm per mm of travel

    # ---- Infill rows (one raster pass between the outline's top and bottom) ----
    {% set span = (sy1 - sy0) - 2*w %}
    {% set n = (span / w)|round(0, 'floor')|int + 1 %}
    {% set pitch = span / (n - 1) %}

    # ---- Heat & home ----
    M140 S{bed}
    M104 S150
    G28
    QUAD_GANTRY_LEVEL
    G28 Z
    # BED_MESH_CALIBRATE   ; uncomment if you want a fresh mesh
    G90
    G1 X{cx} Y{cy} Z10 F6000
    M190 S{bed}
    M109 S{hot}

    M83                                   ; relative extrusion
    # Prime line, front-left of bed
    G1 X20 Y10 Z{h} F6000
    G1 E2 F300
    G1 X120 E{(100 * e_mm * 1.2)|round(4)} F{speed}
    G1 E-0.5 F2100
    G1 Z2 F600

    # ---- Outline ----
    G1 X{sx0} Y{sy0} F9000
    G1 Z{h} F600
    G1 E0.5 F2100
    G1 X{sx1} Y{sy0} E{((sx1-sx0) * e_mm)|round(5)} F{speed}
    G1 X{sx1} Y{sy1} E{((sy1-sy0) * e_mm)|round(5)}
    G1 X{sx0} Y{sy1} E{((sx1-sx0) * e_mm)|round(5)}
    G1 X{sx0} Y{sy0} E{((sy1-sy0) * e_mm)|round(5)}

    # ---- Raster infill ----
    G1 X{sx0} Y{(sy0 + w)|round(4)} E{(w * e_mm)|round(5)}
    {% for i in range(n) %}
        {% set y = sy0 + w + i * pitch %}
        {% if i % 2 == 0 %}
            G1 X{sx1} Y{y|round(4)} E{((sx1-sx0) * e_mm)|round(5)} F{speed}
        {% else %}
            G1 X{sx0} Y{y|round(4)} E{((sx1-sx0) * e_mm)|round(5)} F{speed}
        {% endif %}
        {% if i < n - 1 %}
            {% set x_end = sx1 if i % 2 == 0 else sx0 %}
            G1 X{x_end} Y{(y + pitch)|round(4)} E{(pitch * e_mm)|round(5)}
        {% endif %}
    {% endfor %}

    # ---- Finish ----
    G1 E-0.8 F2100
    G1 Z10 F600
    G90
    G1 X{cx} Y340 F9000
    M104 S0
    M140 S0
    M107
    M84 X Y E
    M82

[gcode_macro MATERIAL_CHANGE]
description: Move toolhead in to position, and retract filament from toolhead, to swap filaments for multimaterial printing
gcode:
	SERVICE_POSITION
	_CLIENT_LINEAR_MOVE E=-100 F=1440

