[gcode_macro FIND_TRIGGER]
gcode:
    G90
    G1 X340 Y340 F6000
    {% for i in range(11) %}
        G1 X{349.5 + i*0.05} Y{349.5 + i*0.05} F600
        M400
        RESPOND MSG="pos {'%.2f' % (349.5 + i*0.05)}"
        QUERY_ENDSTOPS
    {% endfor %}
    G1 X340 Y340 F6000

[gcode_macro SHAKE_TEST]
gcode:
    G28
    # FIND_TRIGGER
    G90
    SET_VELOCITY_LIMIT ACCEL=10000
    G1 X349.8 Y349.8 F6000
    QUERY_ENDSTOPS
    {% for i in range(60) %}
        RESPOND MSG="SHAKE_TEST pass {i + 1} / 60"
        G1 X20 Y20 F27000
        G1 X330 Y330 F27000
        G1 X20 Y330 F27000
        G1 X330 Y20 F27000
        G1 X175 Y175 F27000
    {% endfor %}
    G1 X349.8 Y349.8 F6000
    QUERY_ENDSTOPS          ; expect open/open (no positive drift)
    G1 X340 Y340 F6000
    G1 X350 Y350 F6000
    # FIND_TRIGGER
    QUERY_ENDSTOPS          ; expect TRIGGERED/TRIGGERED (no negative drift)
    DUMP_TMC STEPPER=stepper_x
    DUMP_TMC STEPPER=stepper_y
